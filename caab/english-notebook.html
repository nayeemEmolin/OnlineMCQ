<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>English Digital Notebook · CAAB</title><style>
:root{--bg:#f3f7fb;--panel:#fff;--panel2:#eef5f9;--ink:#14283b;--muted:#5d7185;--line:#d5e1ea;--green:#087a4b;--green-bg:#d9f6e7;--green-line:#65c896;--teal:#087f78;--gold:#8c5b00;--red:#a82737;--red-bg:#ffe4e6;--shadow:0 12px 36px #14334a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.72 system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#e3f0f7;border:1px solid var(--line);color:var(--teal);font-weight:900}.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:900;color:var(--teal)}.brand small{display:block;color:var(--muted)}button{font:inherit;cursor:pointer}.theme,.back,.reset,.next{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--ink);font-weight:750}.hero{padding:clamp(22px,4vw,42px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,var(--panel),var(--panel2));box-shadow:var(--shadow)}.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.2;margin:8px 0 10px}.hero p{margin:0;color:var(--muted);max-width:900px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}.side{position:sticky;top:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);max-height:calc(100vh - 24px);overflow:auto}.side h2{font-size:16px;margin:2px 6px 10px}.chapter-link{display:block;width:100%;text-align:left;padding:9px 10px;margin:4px 0;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:14px}.chapter-link:hover,.chapter-link.active{background:var(--green-bg);border-color:var(--green-line);color:var(--green);font-weight:800}.book{min-width:0}.chapter{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:15px;overflow:hidden}.chapter[hidden]{display:none}.chapter-head{padding:18px 20px;background:var(--panel2);border-bottom:1px solid var(--line)}.chapter-head h2{margin:0;font-size:22px}.chapter-head p{margin:5px 0 0;color:var(--muted)}.chapter-body{padding:20px}.chapter-body h3{margin:20px 0 6px;font-size:18px}.chapter-body h3:first-child{margin-top:0}.chapter-body p{margin:7px 0}.chapter-body ul{padding-left:24px;margin:6px 0 14px}.chapter-body li{margin:5px 0}.table-wrap{overflow-x:auto;margin:10px 0 16px}.study-table{width:100%;border-collapse:collapse;background:var(--panel)}.study-table th,.study-table td{padding:10px 12px;border:1px solid var(--line);text-align:left;vertical-align:top}.study-table th{width:22%;background:var(--panel2);color:var(--teal)}.example-box{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow-wrap:anywhere}.answer-note{color:var(--green)}.important{display:block;margin:10px 0;padding:10px 13px;border-left:4px solid var(--green-line);border-radius:8px;background:var(--green-bg);color:#075a39;font-weight:700}.inline-important{background:var(--green-bg);color:#075a39;font-weight:850;padding:0 3px;border-radius:4px}.source{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin-top:16px}.source a{color:var(--teal);overflow-wrap:anywhere}.quiz{margin-top:20px;border-top:2px solid var(--line);padding-top:16px}.quiz-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.quiz-title h3{margin:0}.score-pill{border:1px solid var(--green-line);background:var(--green-bg);color:var(--green);padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px}.qcard{padding:15px 0;border-bottom:1px solid var(--line)}.qcard:last-of-type{border-bottom:0}.qtext{font-weight:800;margin-bottom:9px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{display:flex;align-items:flex-start;gap:9px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);min-height:48px}.opt:hover:not(:disabled){border-color:var(--teal);background:var(--panel2)}.letter{flex:none;font-weight:900;color:var(--teal)}.opt.correct{background:var(--green-bg);border-color:var(--green-line);color:#075a39}.opt.wrong{background:var(--red-bg);border-color:#e78791;color:var(--red)}.opt:disabled{cursor:default}.feedback{display:none;margin-top:9px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:14px}.feedback.show{display:block}.feedback b{color:var(--green)}.quiz-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.reset{color:var(--teal)}.next{background:var(--teal);border-color:var(--teal);color:white}.progress{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1b9d69,#76dca4);transition:width .2s}.footer{text-align:center;color:var(--muted);font-size:13px;padding:18px}.mobile-chapters{display:none}body[data-theme="dark"]{--bg:#071b2e;--panel:#102b42;--panel2:#15364e;--ink:#f3f7fb;--muted:#b6c7d3;--line:#2b4b61;--green:#65e2a4;--green-bg:#123f31;--green-line:#39bd7b;--teal:#54d7d0;--red:#ff8992;--red-bg:#492632;--gold:#f4bd63;--shadow:0 16px 38px #0003}body[data-theme="dark"] .important,body[data-theme="dark"] .inline-important{color:#c8ffe0}body[data-theme="dark"] .mark{background:#123b4a;color:var(--teal)}@media(max-width:800px){.wrap{padding:13px}.layout{grid-template-columns:1fr}.side{display:none}.mobile-chapters{display:block;margin:12px 0}.mobile-chapters select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit}.hero{border-radius:18px}.chapter-body{padding:16px}.chapter-head{padding:15px 16px}.opts{grid-template-columns:1fr}.theme{padding:8px 10px}.top{align-items:flex-start}}
</style></head><body data-theme="light"><main class="wrap">
<header class="top"><div class="brand"><div class="mark">CA</div><div><div class="eyebrow">CAAB · INTERACTIVE NOTEBOOK</div><small id="brandSub">English · Topic-based study and practice</small></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="back" href="index.html" style="text-decoration:none">← Return to CAAB Exam</a><button class="theme" id="themeBtn" type="button">🌙 Dark mode</button></div></header>
<section class="hero"><div class="eyebrow">STUDY · RECALL · PRACTICE</div><h1 id="pageTitle">English Digital Notebook</h1><p id="pageIntro"></p><div class="chips"><span class="chip" id="chapterCount"></span><span class="chip" id="questionCount"></span><span class="chip">Chapter-wise MCQ practice</span><span class="chip">CAAB topic sequence</span></div></section>
<section id="topicHub" class="layout"></section><div id="chapterArea" hidden><div class="mobile-chapters"><select id="chapterSelect" aria-label="Choose chapter"></select></div><div class="layout"><nav class="side" id="chapterNav"><h2>Chapters</h2></nav><section class="book" id="book"></section></div></div>
<footer class="footer">Follow the topic notes, attempt each MCQ, and use the explanation to review the rule.</footer></main>
<script src="english-topic-data.js?v=20261120q"></script>
<script>
const TOPICS=window.ENGLISH_TOPICS||[],params=new URLSearchParams(location.search),topicId=params.get('topic'),topic=TOPICS.find(t=>t.id===topicId);
const $=id=>document.getElementById(id),labels=['A','B','C','D'],bn=n=>String(n).replace(/\\d/g,d=>'০১২৩৪৫৬৭৮৯'[Number(d)]);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderHub(){ $('topicHub').innerHTML='<div class="book" style="grid-column:1/-1;padding:20px"><h2>English Topics</h2><p>Choose a topic to open its chapter-based digital notebook. Each topic contains topic-specific chapters and practice MCQs.</p><div class="fact-grid">'+TOPICS.map(t=>'<a class="fact" style="text-decoration:none;color:inherit" href="english-notebook.html?topic='+encodeURIComponent(t.id)+'"><b>'+esc(t.name)+'</b><span>'+bn(t.chapters.length)+' অধ্যায় · '+bn(t.chapters.reduce((n,c)=>n+c.qs.length,0))+' MCQ →</span></a>').join('')+'</div></div>';$('chapterCount').textContent=bn(TOPICS.length)+'টি মূল টপিক · '+bn(TOPICS.reduce((n,t)=>n+t.chapters.length,0))+' অধ্যায়';$('questionCount').textContent=bn(TOPICS.reduce((n,t)=>n+t.chapters.reduce((m,c)=>m+c.qs.length,0),0))+'টি অনুশীলন MCQ';$('pageIntro').textContent='The English section is organized like the Bangla and General Knowledge notebooks: eight main topics, each opening a separate chapter navigator with detailed notes and practice.'}
function renderTopic(t){$('topicHub').hidden=true;$('chapterArea').hidden=false;$('brandSub').textContent='English · '+t.short;$('pageTitle').textContent=t.name;$('pageIntro').textContent='এই মূল টপিকের অধ্যায়গুলোতে বিস্তারিত নোট, পরীক্ষায় গুরুত্বপূর্ণ নিয়ম এবং ব্যাখ্যাসহ অনুশীলন MCQ রয়েছে।';$('chapterCount').textContent=bn(t.chapters.length)+'টি অধ্যায়';$('questionCount').textContent=bn(t.chapters.reduce((n,c)=>n+c.qs.length,0))+'টি অনুশীলন MCQ';const nav=$('chapterNav'),select=$('chapterSelect'),book=$('book');nav.innerHTML='<h2>অধ্যায়সমূহ</h2>';t.chapters.forEach((l,li)=>{const b=document.createElement('button');b.type='button';b.className='chapter-link';b.textContent=l.title;b.onclick=()=>show(li);nav.appendChild(b);const o=document.createElement('option');o.value=li;o.textContent=l.title;select.appendChild(o);const qs=l.qs.map((q,qi)=>'<div class="qcard" data-q="'+li+'-'+qi+'"><div class="qtext">'+bn(qi+1)+'. '+esc(q[0])+'</div><div class="opts">'+q[1].map((v,oi)=>'<button class="opt" data-li="'+li+'" data-qi="'+qi+'" data-oi="'+oi+'"><span class="letter">'+labels[oi]+'.</span><span>'+esc(v)+'</span></button>').join('')+'</div><div class="feedback" id="fb-'+li+'-'+qi+'"></div></div>').join('');const article=document.createElement('article');article.className='chapter';article.id='chapter-'+li;article.hidden=li!==0;article.innerHTML='<header class="chapter-head"><h2>'+esc(l.title)+'</h2><p>'+esc(l.lead)+' · '+bn(l.qs.length)+'টি MCQ</p></header><div class="chapter-body">'+l.notes+'<section class="quiz"><div class="quiz-title"><h3>Practice MCQs</h3><span class="score-pill" id="score-'+li+'">০ / '+bn(l.qs.length)+' সঠিক</span></div><div class="progress"><i id="progress-'+li+'"></i></div>'+qs+'<div class="quiz-actions"><button class="reset" type="button" data-reset="'+li+'">Reset this chapter</button><span class="muted" id="done-'+li+'">০ / '+bn(l.qs.length)+' উত্তর</span></div></section></div>';book.appendChild(article)});select.onchange=()=>show(+select.value);document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.li,+b.dataset.qi,+b.dataset.oi));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>reset(+b.dataset.reset));const hash=location.hash.match(/chapter-(\\d+)/);show(hash?Math.min(+hash[1],t.chapters.length-1):0)}
const answers=topic?topic.chapters.map(l=>Array(l.qs.length).fill(null)):[];
function answer(li,qi,oi){if(answers[li][qi]!==null)return;answers[li][qi]=oi;const q=topic.chapters[li].qs[qi],card=document.querySelector('[data-q="'+li+'-'+qi+'"]');card.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add('correct');if(i===oi&&oi!==q[2])b.classList.add('wrong')});const fb=$('fb-'+li+'-'+qi);fb.innerHTML='<b>Correct answer: '+labels[q[2]]+'. '+esc(q[1][q[2]])+'</b><br>'+esc(q[3]);fb.classList.add('show');update(li)}
function update(li){const total=answers[li].length,done=answers[li].filter(x=>x!==null).length,right=answers[li].filter((x,i)=>x===topic.chapters[li].qs[i][2]).length;$('score-'+li).textContent=bn(right)+' / '+bn(total)+' correct';$('done-'+li).textContent=bn(done)+' / '+bn(total)+' answered';$('progress-'+li).style.width=done/total*100+'%'}
function reset(li){answers[li].fill(null);document.querySelectorAll('#chapter-'+li+' .qcard').forEach(card=>{card.querySelectorAll('.opt').forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong')});const fb=card.querySelector('.feedback');fb.classList.remove('show');fb.innerHTML=''});update(li)}
function show(li){document.querySelectorAll('.chapter').forEach((x,i)=>x.hidden=i!==li);document.querySelectorAll('.chapter-link').forEach((x,i)=>x.classList.toggle('active',i===li));$('chapterSelect').value=String(li);history.replaceState(null,'','#chapter-'+li);window.scrollTo({top:0,behavior:'smooth'})}
$('themeBtn').onclick=()=>{const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';$('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('caabEnglishTheme',dark?'dark':'light')};if(localStorage.getItem('caabEnglishTheme')==='dark'){document.body.dataset.theme='dark';$('themeBtn').textContent='☀️ Light mode'}
if(topic)renderTopic(topic);else renderHub();
</script></body></html>
